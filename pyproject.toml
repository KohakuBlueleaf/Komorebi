[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "komorebi-tt"
version = "0.1.0"
description = "A programming model and runtime for the Tensix grid of Tenstorrent Blackhole cards"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.13"
dependencies = ["numpy"]

[project.optional-dependencies]
dev = ["pytest", "pyyaml", "ruff", "black", "blacken-docs", "clang-format>=22"]
# The prebuilt tt-metal runtime (runtime/ in this repository), used when TT_METAL_HOME is
# unset; not yet required.
runtime = ["komorebi-runtime>=0.81.1.1,<0.81.2"]

[project.scripts]
kmr = "komorebi.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["komorebi", "komorebi.*", "komorebi_native", "komorebi_native.*"]

# The native sources travel as data: headers, kernel sources, CMake helpers, the host
# module's source; the dispatch kernel image when packaging/build_wheel.py put it there.
[tool.setuptools.package-data]
komorebi = ["km-dispatch.bin", "*/*.md"]
komorebi_native = ["**/*"]

[tool.setuptools.exclude-package-data]
"*" = ["*.so", "*.o", "*.pyc"]

[tool.black]
target-version = ["py313"]

[tool.ruff]
line-length = 88
target-version = "py313"
src = [".", "src", "tests", "examples", "runtime/src"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "BLE", "UP", "SIM", "PERF", "RUF100", "PLC0415"]
ignore = ["B905", "PERF203"]

[tool.ruff.lint.isort]
known-first-party = ["komorebi", "komorebi_runtime", "ref", "projects"]

[tool.ruff.lint.pycodestyle]
max-doc-length = 88

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "runtime/src"]
markers = [
    "card: needs a Tenstorrent card (KMR_CARD=1)",
]
