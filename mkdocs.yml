site_name: Komorebi
site_url: https://kohakublueleaf.github.io/Komorebi/
site_description: A programming model and framework for the Tensix grid and the X280 cores of a Tenstorrent Blackhole card
repo_url: https://github.com/KohakuBlueleaf/Komorebi
repo_name: KohakuBlueleaf/Komorebi
edit_uri: ""
docs_dir: docs
strict: true

# The site is the reading surface of the tutorial; the pages outside docs/ that it
# shows (the examples' READMEs) are added by the hook, which also turns links to other
# files of the repository into links to the site or to GitHub.
hooks:
  - docs/_site/hooks.py

exclude_docs: |
  _site/
  tutorial/README.md

theme:
  name: material
  language: en
  font: false
  features:
    - navigation.footer
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - toc.follow
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search

extra_css:
  - assets/gem.css
  - assets/tutorial.css
extra_javascript:
  - assets/grid.js
  - assets/diagram.js

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: ["."]
      check_paths: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys

validation:
  omitted_files: info
  absolute_links: warn
  unrecognized_links: warn
  anchors: warn

# The tutorial's parts stay folded in the side navigation until one is opened (no
# navigation.expand above), so the other sections stay in sight.
nav:
  - Home: README.md
  - Getting started:
      - install.md
  - Tutorial:
      - tutorial/index.md
  - Concepts:
      - concepts/dispatch.md
      - concepts/runtime.md
      - concepts/islands.md
      - concepts/reset.md
      - streams.md
      - graphs.md
      - threads.md
  - Guides:
      - guides/debug-a-command-that-does-not-finish.md
      - guides/recovery.md
      - guides/measure-a-command.md
      - guides/run-off-the-card.md
      - development.md
  - Reference:
      - reference/host.md
      - reference/runtime.md
      - reference/ports.md
      - reference/broadcast.md
      - reference/movement.md
      - reference/dynamic.md
      - reference/threads.md
      - reference/overlays.md
      - reference/islands.md
      - reference/wormhole.md
      - reference/chain.md
      - reference/tile.md
      - reference/formats.md
      - reference/classes.md
      - reference/hazards.md
  - Examples:
      - examples/README.md
      - examples/01_mapcollect/README.md
      - examples/02_merge_tree/README.md
      - examples/03_broadcast/README.md
      - examples/04_uop_stream/README.md
      - examples/05_forward/README.md
      - examples/06_graph/README.md
      - examples/07_work_cluster/README.md
      - examples/08_parallel_thread/README.md
      - examples/09_bucket_sort/README.md
      - examples/10_x280_ports/README.md
      - examples/11_movement/README.md
      - examples/12_overlays/README.md
      - examples/13_thread_commands/README.md
      - examples/14_message_handlers/README.md
      - examples/15_leader/README.md
      - examples/16_two_programs/README.md
      - examples/17_leader_overlay/README.md
      - examples/18_thread_split/README.md
      - examples/19_thread_programs/README.md
      - examples/20_message_overlays/README.md
      - examples/21_thread_load/README.md
      - examples/22_gate/README.md
      - examples/23_message_body/README.md
      - examples/24_thread_rank/README.md
      - examples/25_islands_threads/README.md
      - examples/26_islands_sum/README.md
      - examples/27_islands_gather/README.md
      - examples/28_islands_reduce/README.md
      - examples/29_chain/README.md
      - examples/30_add_overlay/README.md
      - examples/31_swiglu/README.md
      - examples/32_islands_l1/README.md
  - IR (being built):
      - ir/checks.md
      - ir/operations.md
      - ir/bytecode.md
      - ir/run-scripts.md
  - Measured: measured.md
  - Releases:
      - releases/0.4.0.md
      - releases/0.3.0.md
      - releases/0.2.0.md
      - releases/0.1.0.md
