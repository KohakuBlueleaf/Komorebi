[package]
name = "komorebi-ir"
version = "0.1.0"
edition = "2021"
description = "Komorebi IR: the text form of a Komorebi program, its parser, its writer and its checks"
license = "Apache-2.0"
publish = false

[lib]
name = "komorebi_ir"
path = "src/komorebi-ir/lib.rs"

[[bin]]
name = "komo"
path = "src/komorebi-ir/bin/komo.rs"

[[test]]
name = "tensix"
path = "tests/ir/tensix.rs"

[[test]]
name = "roundtrip"
path = "tests/ir/roundtrip.rs"

[[test]]
name = "interp_values"
path = "tests/ir/interp_values.rs"

[[test]]
name = "golden"
path = "tests/ir/golden.rs"

[[test]]
name = "program_validate"
path = "tests/ir/program_validate.rs"

[[test]]
name = "program_lower"
path = "tests/ir/program_lower.rs"

[[test]]
name = "program_derive"
path = "tests/ir/program_derive.rs"

[[test]]
name = "layers"
path = "tests/ir/layers.rs"

[[test]]
name = "interp_run"
path = "tests/ir/interp_run.rs"

[[test]]
name = "bytecode"
path = "tests/ir/bytecode.rs"

[[test]]
name = "backend"
path = "tests/ir/backend.rs"

[[test]]
name = "parity"
path = "tests/ir/parity.rs"

[[test]]
name = "origin"
path = "tests/ir/origin.rs"

[[test]]
name = "frontend"
path = "tests/ir/frontend.rs"

[[test]]
name = "tensix_tile"
path = "tests/ir/tensix_tile.rs"

[[test]]
name = "tensix_rows"
path = "tests/ir/tensix_rows.rs"

[[test]]
name = "tensix_chunks"
path = "tests/ir/tensix_chunks.rs"

[[test]]
name = "editors"
path = "tests/ir/editors.rs"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
# The Python face (bindings/python.rs), only with the feature `python`.
pyo3 = { version = "=0.30.1", optional = true, features = ["abi3-py313"] }

[features]
# The extension module `komorebi_ir._rs`, built by maturin (packaging/ir/).
python = ["dep:pyo3"]
