[package]
name = "komorebi-ir"
version = "0.1.0"
edition = "2021"
description = "Komorebi IR: the text form of a Komorebi program, its parser, its writer and its checks"
license = "Apache-2.0"
publish = false

[lib]
name = "komorebi_ir"
path = "src/komorebi-ir/lib.rs"

[[bin]]
name = "komo"
path = "src/komorebi-ir/bin/komo.rs"

[[test]]
name = "roundtrip"
path = "tests/ir/roundtrip.rs"

[[test]]
name = "interp_values"
path = "tests/ir/interp_values.rs"

[[test]]
name = "golden"
path = "tests/ir/golden.rs"

[[test]]
name = "program_validate"
path = "tests/ir/program_validate.rs"

[[test]]
name = "program_lower"
path = "tests/ir/program_lower.rs"

[[test]]
name = "program_derive"
path = "tests/ir/program_derive.rs"

[[test]]
name = "layers"
path = "tests/ir/layers.rs"

[[test]]
name = "interp_run"
path = "tests/ir/interp_run.rs"

[[test]]
name = "bytecode"
path = "tests/ir/bytecode.rs"

[dependencies]
pest = "2.7"
pest_derive = "2.7"
