# Two P150 cards joined by ports 4 to 7: the mock of `kmr prebuild --cards 0,1`.
arch:
  0: blackhole
  1: blackhole
chips:
  {}
chip_unique_ids:
  1: 2
  0: 1
ethernet_connections:
  -
    - chip: 0
      chan: 4
    - chip: 1
      chan: 4
  -
    - chip: 0
      chan: 5
    - chip: 1
      chan: 5
  -
    - chip: 0
      chan: 6
    - chip: 1
      chan: 6
  -
    - chip: 0
      chan: 7
    - chip: 1
      chan: 7
ethernet_connections_to_remote_devices:
  []
chips_with_mmio:
  - 0: 0
  - 1: 1
io_device_type: PCIe
harvesting:
  0:
    noc_translation: true
    harvest_mask: 192
    dram_harvesting_mask: 0
    eth_harvesting_mask: 288
    pcie_harvesting_mask: 2
    l2cpu_harvesting_mask: 0
  1:
    noc_translation: true
    harvest_mask: 192
    dram_harvesting_mask: 0
    eth_harvesting_mask: 288
    pcie_harvesting_mask: 2
    l2cpu_harvesting_mask: 0
chip_to_bus_id:
  0: "0x0001"
  1: "0x0041"
boards:
  -
    - board_id: 4402341478401
    - board_type: p150
    - chips:
        - 1
  -
    - board_id: 4402341478400
    - board_type: p150
    - chips:
        - 0
asic_locations:
  0: 0
  1: 0
chip_pci_bdfs:
  0: 0000:01:00.0
  1: 0000:41:00.0
