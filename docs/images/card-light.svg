<svg xmlns="http://www.w3.org/2000/svg" width="830" height="676" viewBox="0 0 830 676" role="img">
<title>The card as Komorebi runs it</title>
<style>
  text { font-family: -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
  .b { font-weight: 600; }
  .h { font-size: 14px; font-weight: 600; }
  .m { fill: #59636e; }
  .a { fill: #bc4c00; }
  .s { font-size: 12px; }
  .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
  .plan { fill: none; stroke: #818b98; stroke-width: 1; stroke-dasharray: 5 4; }
  .cell { fill: #eaeef2; stroke: none; }
  .team { fill: #ffd8b5; stroke: #bc4c00; stroke-width: 1; }
  .abox { fill: #fff1e5; stroke: #bc4c00; stroke-width: 1.5; }
  .ln { stroke: #818b98; stroke-width: 1.5; fill: none; }
  .thin { stroke: #818b98; stroke-width: 1; fill: none; }
  .grid { stroke: #d1d9e0; stroke-width: 1; fill: none; }
  .al { stroke: #bc4c00; stroke-width: 2.5; fill: none; }
  .ad { stroke: #bc4c00; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
  .athin { stroke: #bc4c00; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5"
      markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
  </marker>
  <marker id="hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5"
      markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#818b98"/>
  </marker>
</defs>
<rect width="830" height="676" fill="#ffffff"/>
<rect x="16" y="12" width="540" height="62" rx="4" class="box"/>
<text x="30" y="36" class="b" xml:space="preserve">host: Python Program, Session and Run</text>
<text x="30" y="58" class="mono s" xml:space="preserve">run.issue(seg, team, args)     run.wait(tickets)</text>
<line x1="60" y1="76" x2="60" y2="124" class="ln" marker-end="url(#hl)"/>
<text x="70" y="104" class="s" xml:space="preserve">commands, 64 B each, stored in batches</text>
<line x1="360" y1="124" x2="360" y2="76" class="ln" marker-end="url(#hl)"/>
<text x="370" y="104" class="s" xml:space="preserve">events, 16 B each, into host memory</text>
<rect x="16" y="126" width="540" height="124" rx="4" class="box"/>
<text x="30" y="148" class="b" xml:space="preserve">X280 cluster 0: the dispatch kernel, one image on core 0</text>
<rect x="30" y="160" width="121" height="78" rx="4" class="cell"/>
<text x="40" y="180" class="b" xml:space="preserve">host ring</text>
<text x="40" y="198" class="s m" xml:space="preserve">commands, taken</text>
<text x="40" y="214" class="s m" xml:space="preserve">in order</text>
<rect x="159" y="160" width="121" height="78" rx="4" class="cell"/>
<text x="169" y="180" class="b" xml:space="preserve">completion</text>
<text x="169" y="198" class="s m" xml:space="preserve">up to 16 slots, one</text>
<text x="169" y="214" class="s m" xml:space="preserve">per record in flight</text>
<rect x="288" y="160" width="121" height="78" rx="4" class="cell"/>
<text x="298" y="180" class="b" xml:space="preserve">deadlines</text>
<text x="298" y="198" class="s m" xml:space="preserve">a late record</text>
<text x="298" y="214" class="s m" xml:space="preserve">stops the grid</text>
<rect x="417" y="160" width="121" height="78" rx="4" class="cell"/>
<text x="427" y="180" class="b" xml:space="preserve">grid port</text>
<text x="427" y="198" class="s m" xml:space="preserve">one multicast</text>
<text x="427" y="214" class="s m" xml:space="preserve">window per panel</text>
<rect x="572" y="126" width="242" height="124" rx="4" class="plan"/>
<text x="586" y="148" class="b m" xml:space="preserve">planned</text>
<text x="586" y="170" class="s m" xml:space="preserve">on cluster 0, deciding on the card:</text>
<text x="586" y="186" class="s m" xml:space="preserve">micro-op streams, the job queue,</text>
<text x="586" y="202" class="s m" xml:space="preserve">the graph executor</text>
<text x="586" y="218" class="s m" xml:space="preserve">on clusters 1 to 3: user X280</text>
<text x="586" y="234" class="s m" xml:space="preserve">threads with rings to cluster 0</text>
<line x1="200" y1="252" x2="200" y2="336" class="al" marker-end="url(#ha)"/>
<text x="212" y="276" class="b a" xml:space="preserve">one 64-byte record, stored into every core's ring</text>
<text x="212" y="294" class="s m" xml:space="preserve">0.77 µs per record with 4 in flight, 120 cores</text>
<text x="212" y="310" class="s m" xml:space="preserve">(landing experiment, protocol in use)</text>
<text x="101" y="276" class="s a" xml:space="preserve">one word</text>
<text x="101" y="292" class="s a" xml:space="preserve">from the</text>
<text x="101" y="308" class="s a" xml:space="preserve">leader</text>
