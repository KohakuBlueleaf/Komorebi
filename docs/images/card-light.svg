<line x1="91" y1="390" x2="91" y2="252" class="al" marker-end="url(#ha)"/>
<text x="91" y="407.5" class="s b a" text-anchor="middle" xml:space="preserve">L</text>
<line x1="163" y1="403" x2="104" y2="403" class="athin" marker-end="url(#ha)"/>
<line x1="163.308" y1="427.103" x2="103.333" y2="407.111" class="athin" marker-end="url(#ha)"/>
<line x1="215.429" y1="452.772" x2="103.07" y2="407.828" class="athin" marker-end="url(#ha)"/>
<text x="28" y="616" class="b" xml:space="preserve">Tensix grid, 12 x 10 cores in core order (row by row)</text>
<text x="28" y="634" class="s m" xml:space="preserve">tinted: the record's team, first 26, count 30</text>
<text x="28" y="650" class="s m" xml:space="preserve">L: its leader; arrows: members report to it</text>
<text x="28" y="666" class="s m" xml:space="preserve">grey cores skip the record</text>
<rect x="260" y="416" width="26" height="26" rx="4" class="athin"/>
<line x1="286" y1="429" x2="380" y2="429" class="thin"/>
<rect x="380" y="340" width="434" height="280" rx="4" class="box"/>
<text x="394" y="364" class="b" xml:space="preserve">every core: three resident kernels of the program</text>
<rect x="394" y="378" width="126" height="108" rx="4" class="cell"/>
<text x="404" y="398" class="b" xml:space="preserve">reader</text>
<text x="404" y="416" class="s m" xml:space="preserve">scans the ring,</text>
<text x="404" y="432" class="s m" xml:space="preserve">takes the next</text>
<text x="404" y="448" class="s m" xml:space="preserve">record whose</text>
<text x="404" y="464" class="s m" xml:space="preserve">team holds it</text>
<rect x="534" y="378" width="126" height="108" rx="4" class="cell"/>
<text x="544" y="398" class="b" xml:space="preserve">compute</text>
<text x="544" y="416" class="s m" xml:space="preserve">switches on</text>
<text x="544" y="432" class="s m" xml:space="preserve">the segment,</text>
<text x="544" y="448" class="s m" xml:space="preserve">runs its body</text>
<line x1="521" y1="432" x2="532" y2="432" class="ln" marker-end="url(#hl)"/>
<rect x="674" y="378" width="126" height="108" rx="4" class="cell"/>
<text x="684" y="398" class="b" xml:space="preserve">writer</text>
<text x="684" y="416" class="s m" xml:space="preserve">writes outputs,</text>
<text x="684" y="432" class="s m" xml:space="preserve">then reports</text>
<text x="684" y="448" class="s m" xml:space="preserve">the record</text>
<line x1="661" y1="432" x2="672" y2="432" class="ln" marker-end="url(#hl)"/>
<rect x="394" y="498" width="406" height="66" rx="4" class="cell"/>
<text x="404" y="518" class="b s" xml:space="preserve">L1, at the same address on every core</text>
<text x="404" y="536" class="s m" xml:space="preserve">ring of 16 records, completion counters,</text>
<text x="404" y="552" class="s m" xml:space="preserve">the record being run, state words, trace</text>
<text x="394" y="588" class="s m" xml:space="preserve">The program writes the switch; the runtime owns</text>
<text x="394" y="604" class="s m" xml:space="preserve">the loops, the bounded waits and the reports.</text>
</svg>
