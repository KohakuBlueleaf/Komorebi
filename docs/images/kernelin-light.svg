<text x="30.0" y="154.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start" xml:space="preserve">Between two kernels the cores wait for the host: an event goes up, the host decides, the next command comes down.</text>
