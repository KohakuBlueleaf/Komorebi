<text x="30.0" y="372.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start" xml:space="preserve">The host appends kernel calls to a list in DRAM, ahead of the cores; a call with no kernel yet is compiled and added to the live run.</text>
<text x="30.0" y="390.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start" xml:space="preserve">An X280 thread takes each entry and submits it. The way out is a kernel too: it pushes the result's pages to the host's memory.</text>
<rect x="20.0" y="414.0" width="22.0" height="16.0" rx="3" fill="#a5d4ff" stroke="#0969da" stroke-width="1"/>
<text x="50.0" y="427.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">the host or the thread works</text>
<text x="267.6" y="427.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">an entry appended</text>
<text x="430.0" y="427.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">a command submitted</text>
<text x="613.4" y="427.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">an event back</text>
<rect x="20.0" y="438.0" width="22.0" height="16.0" rx="3" fill="#ffc999" stroke="#bc4c00" stroke-width="1"/>
<text x="50.0" y="451.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">a kernel computes</text>
<rect x="179.4" y="438.0" width="22.0" height="16.0" rx="3" fill="#ffffff" stroke="#818b98" stroke-width="1"/>
<text x="209.4" y="451.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">an entry waiting in the list</text>
<rect x="381.9" y="438.0" width="22.0" height="16.0" rx="3" fill="#fff8c5" stroke="#9a6700" stroke-width="1.5" stroke-dasharray="4 3"/>
<text x="411.9" y="451.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">a kernel compiled on its first use</text>
<text x="50.0" y="475.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">pages to the host's memory</text>
<text x="20.0" y="500.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start" xml:space="preserve">Measured in the nn project (one card, its cheapest kernel on 120 cores): 140.9 µs a call with the host submitting and waiting,</text>
<text x="20.0" y="518.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start" xml:space="preserve">23.0 µs a call with the host appending to an open list, 4.4 µs replaying a written list. Time in the figure is schematic.</text>
