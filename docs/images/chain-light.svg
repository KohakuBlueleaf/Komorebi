<text x="30.0" y="398.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start" xml:space="preserve">A core reads its next record when its kernel ends. The roots of the kernel before mark the cores that read what they wrote;</text>
<text x="30.0" y="416.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start" xml:space="preserve">while a core waits for its mark it already reads the weight of its next kernel. The thread is asked once.</text>
<rect x="20.0" y="440.0" width="22.0" height="16.0" rx="3" fill="#a5d4ff" stroke="#0969da" stroke-width="1"/>
<text x="50.0" y="453.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">the thread works</text>
<text x="200.8" y="453.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">a command submitted</text>
<text x="384.2" y="453.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">an event back</text>
<rect x="486.4" y="440.0" width="22.0" height="16.0" rx="3" fill="#ffc999" stroke="#bc4c00" stroke-width="1"/>
<text x="516.4" y="453.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">a kernel computes</text>
<rect x="20.0" y="464.0" width="22.0" height="16.0" rx="3" fill="#ffe27a" stroke="#9a6700" stroke-width="1"/>
<text x="50.0" y="477.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">a weight read from DRAM</text>
<text x="251.7" y="477.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#1f2328" text-anchor="start" xml:space="preserve">a mark: your input is written</text>
<text x="20.0" y="502.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start" xml:space="preserve">Measured in the decode project (Qwen3-1.7B in bfloat16, one card, 4,096 cached tokens): 410 µs a layer a command a step,</text>
<text x="20.0" y="520.0" font-family="-apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" font-size="12" fill="#59636e" text-anchor="start" xml:space="preserve">315 µs with the whole token as one chain: 87 and 113 tokens a second. Time in the figure is schematic.</text>
