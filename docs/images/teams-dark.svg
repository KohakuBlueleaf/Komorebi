<svg xmlns="http://www.w3.org/2000/svg" width="830" height="514" viewBox="0 0 830 514" role="img">
<title>Teams and records in time</title>
<style>
  text { font-family: -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 13px; fill: #e6edf3; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
  .b { font-weight: 600; }
  .h { font-size: 14px; font-weight: 600; }
  .m { fill: #9198a1; }
  .a { fill: #f0883e; }
  .s { font-size: 12px; }
  .box { fill: #161b22; stroke: #3d444d; stroke-width: 1; }
  .plan { fill: none; stroke: #6e7681; stroke-width: 1; stroke-dasharray: 5 4; }
  .dram { fill: #2d3540; stroke: none; }
  .edge { fill: #161b22; stroke: #3d444d; stroke-width: 1; }
  .off { fill: none; stroke: #3d444d; stroke-width: 1; stroke-dasharray: 3 3; }
  .hot { fill: #f0883e; stroke: none; }
  .on { fill: #0d1117; }
  .cell { fill: #21262d; stroke: none; }
  .team { fill: #6b3a14; stroke: #f0883e; stroke-width: 1; }
  .abox { fill: #2d1a0c; stroke: #f0883e; stroke-width: 1.5; }
  .ln { stroke: #6e7681; stroke-width: 1.5; fill: none; }
  .thin { stroke: #6e7681; stroke-width: 1; fill: none; }
  .grid { stroke: #3d444d; stroke-width: 1; fill: none; }
  .al { stroke: #f0883e; stroke-width: 2.5; fill: none; }
  .ad { stroke: #f0883e; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
  .athin { stroke: #f0883e; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5"
      markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#f0883e"/>
  </marker>
  <marker id="hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5"
      markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#6e7681"/>
  </marker>
</defs>
<rect width="830" height="514" fill="#0d1117"/>
<text x="16" y="18" class="b s" xml:space="preserve">dispatch kernel</text>
<text x="124" y="64" class="s m" text-anchor="end" xml:space="preserve">slot 0</text>
<text x="124" y="86" class="s m" text-anchor="end" xml:space="preserve">slot 1</text>
<text x="124" y="108" class="s m" text-anchor="end" xml:space="preserve">slot 2</text>
<text x="124" y="146" class="s m" text-anchor="end" xml:space="preserve">core 0  (1, 2)</text>
<line x1="132" y1="142" x2="812" y2="142" class="grid"/>
<text x="124" y="170" class="s m" text-anchor="end" xml:space="preserve">core 1  (2, 2)</text>
<line x1="132" y1="166" x2="812" y2="166" class="grid"/>
<text x="124" y="194" class="s m" text-anchor="end" xml:space="preserve">core 2  (3, 2)</text>
<line x1="132" y1="190" x2="812" y2="190" class="grid"/>
<text x="124" y="218" class="s m" text-anchor="end" xml:space="preserve">core 3  (4, 2)</text>
<line x1="132" y1="214" x2="812" y2="214" class="grid"/>
<text x="124" y="242" class="s m" text-anchor="end" xml:space="preserve">core 4  (5, 2)</text>
<line x1="132" y1="238" x2="812" y2="238" class="grid"/>
<text x="124" y="266" class="s m" text-anchor="end" xml:space="preserve">core 5  (6, 2)</text>
<line x1="132" y1="262" x2="812" y2="262" class="grid"/>
<text x="124" y="290" class="s m" text-anchor="end" xml:space="preserve">core 6  (11, 2)</text>
<line x1="132" y1="286" x2="812" y2="286" class="grid"/>
<text x="124" y="314" class="s m" text-anchor="end" xml:space="preserve">core 7  (12, 2)</text>
<line x1="132" y1="310" x2="812" y2="310" class="grid"/>
<text x="124" y="338" class="s m" text-anchor="end" xml:space="preserve">core 8  (13, 2)</text>
<line x1="132" y1="334" x2="812" y2="334" class="grid"/>
<text x="124" y="362" class="s m" text-anchor="end" xml:space="preserve">core 9  (14, 2)</text>
<line x1="132" y1="358" x2="812" y2="358" class="grid"/>
<text x="124" y="386" class="s m" text-anchor="end" xml:space="preserve">core 10  (15, 2)</text>
<line x1="132" y1="382" x2="812" y2="382" class="grid"/>
<text x="124" y="410" class="s m" text-anchor="end" xml:space="preserve">core 11  (16, 2)</text>
<line x1="132" y1="406" x2="812" y2="406" class="grid"/>
<text x="124" y="126" class="s b" text-anchor="end" xml:space="preserve">index (NoC0 x, y)</text>
<line x1="20" y1="274" x2="812" y2="274" class="thin" stroke-dasharray="2 4"/>
<text x="812" y="270" class="s m" text-anchor="end" xml:space="preserve">panel 0</text>
<text x="812" y="288" class="s m" text-anchor="end" xml:space="preserve">panel 1</text>
<line x1="150" y1="48" x2="150" y2="418" class="thin" stroke-dasharray="3 3"/>
<line x1="170" y1="48" x2="170" y2="418" class="thin" stroke-dasharray="3 3"/>
<line x1="190" y1="48" x2="190" y2="418" class="thin" stroke-dasharray="3 3"/>
<rect x="150" y="52" width="274" height="16" rx="3" class="team"/>
<text x="158" y="64.5" class="s" xml:space="preserve">R1: team of cores 0-4</text>
<rect x="160" y="134" width="232" height="16" rx="3" class="team"/>
<text x="166" y="146.5" class="s b a" xml:space="preserve">R1</text>
<rect x="160" y="158" width="244" height="16" rx="3" class="team"/>
<text x="166" y="170.5" class="s b a" xml:space="preserve">R1</text>
<rect x="160" y="182" width="238" height="16" rx="3" class="team"/>
<text x="166" y="194.5" class="s b a" xml:space="preserve">R1</text>
<rect x="160" y="206" width="250" height="16" rx="3" class="team"/>
<text x="166" y="218.5" class="s b a" xml:space="preserve">R1</text>
<rect x="160" y="230" width="240" height="16" rx="3" class="team"/>
<text x="166" y="242.5" class="s b a" xml:space="preserve">R1</text>
<line x1="405" y1="166" x2="418" y2="142" class="athin"/>
<line x1="399" y1="190" x2="418" y2="142" class="athin"/>
<line x1="411" y1="214" x2="418" y2="142" class="athin"/>
<line x1="401" y1="238" x2="418" y2="142" class="athin"/>
<line x1="424" y1="134" x2="424" y2="116" class="al" marker-end="url(#ha)"/>
<rect x="170" y="74" width="364" height="16" rx="3" class="team"/>
<text x="178" y="86.5" class="s" xml:space="preserve">R2: team of cores 6-11</text>
<rect x="182" y="278" width="324" height="16" rx="3" class="team"/>
<text x="188" y="290.5" class="s b a" xml:space="preserve">R2</text>
<rect x="182" y="302" width="312" height="16" rx="3" class="team"/>
<text x="188" y="314.5" class="s b a" xml:space="preserve">R2</text>
<rect x="182" y="326" width="330" height="16" rx="3" class="team"/>
<text x="188" y="338.5" class="s b a" xml:space="preserve">R2</text>
<rect x="182" y="350" width="318" height="16" rx="3" class="team"/>
<text x="188" y="362.5" class="s b a" xml:space="preserve">R2</text>
<rect x="182" y="374" width="338" height="16" rx="3" class="team"/>
<text x="188" y="386.5" class="s b a" xml:space="preserve">R2</text>
<rect x="182" y="398" width="326" height="16" rx="3" class="team"/>
<text x="188" y="410.5" class="s b a" xml:space="preserve">R2</text>
<line x1="495" y1="310" x2="528" y2="286" class="athin"/>
<line x1="513" y1="334" x2="528" y2="286" class="athin"/>
<line x1="501" y1="358" x2="528" y2="286" class="athin"/>
<line x1="521" y1="382" x2="528" y2="286" class="athin"/>
<line x1="509" y1="406" x2="528" y2="286" class="athin"/>
<line x1="534" y1="278" x2="534" y2="116" class="al" marker-end="url(#ha)"/>
<rect x="190" y="96" width="504" height="16" rx="3" class="box"/>
<text x="198" y="108.5" class="s" xml:space="preserve">R3: team of cores 3-8</text>
<rect x="418" y="206" width="82" height="16" rx="3" class="box"/>
<text x="424" y="218.5" class="s b m" xml:space="preserve">R3</text>
<rect x="410" y="230" width="82" height="16" rx="3" class="box"/>
<text x="416" y="242.5" class="s b m" xml:space="preserve">R3</text>
<rect x="200" y="254" width="146" height="16" rx="3" class="box"/>
<text x="206" y="266.5" class="s b m" xml:space="preserve">R3</text>
<rect x="522" y="278" width="158" height="16" rx="3" class="box"/>
<text x="528" y="290.5" class="s b m" xml:space="preserve">R3</text>
<rect x="502" y="302" width="148" height="16" rx="3" class="box"/>
<text x="508" y="314.5" class="s b m" xml:space="preserve">R3</text>
<rect x="520" y="326" width="146" height="16" rx="3" class="box"/>
<text x="526" y="338.5" class="s b m" xml:space="preserve">R3</text>
<line x1="493" y1="238" x2="688" y2="214" class="thin"/>
<line x1="347" y1="262" x2="688" y2="214" class="thin"/>
<line x1="681" y1="286" x2="688" y2="214" class="thin"/>
<line x1="651" y1="310" x2="688" y2="214" class="thin"/>
<line x1="667" y1="334" x2="688" y2="214" class="thin"/>
<line x1="694" y1="206" x2="694" y2="116" class="ln" marker-end="url(#hl)"/>
<line x1="170" y1="34" x2="424" y2="34" class="al"/>
<line x1="170" y1="29" x2="170" y2="39" class="al"/>
<line x1="424" y1="29" x2="424" y2="39" class="al"/>
<text x="180" y="26" class="s b a" xml:space="preserve">R1 and R2 in flight together: disjoint teams</text>
<text x="546" y="362" class="s" xml:space="preserve">R3 overlaps both teams: each member takes</text>
<text x="546" y="386" class="s" xml:space="preserve">it after its R1 or R2 (core 5 at once), and</text>
<text x="546" y="410" class="s" xml:space="preserve">its leader, core 3, waits for the last report</text>
<line x1="132" y1="436" x2="812" y2="436" class="ln" marker-end="url(#hl)"/>
<text x="812" y="454" class="s m" text-anchor="end" xml:space="preserve">time (schematic)</text>
<line x1="120" y1="472" x2="140" y2="472" class="thin" stroke-dasharray="3 3"/>
<text x="148" y="476" class="s" xml:space="preserve">the record lands on every core; cores outside its team skip it</text>
<line x1="120" y1="494" x2="140" y2="494" class="athin"/>
<text x="148" y="498" class="s" xml:space="preserve">a member reports to its leader</text>
<line x1="380" y1="502" x2="380" y2="486" class="al" marker-end="url(#ha)"/>
<text x="392" y="498" class="s" xml:space="preserve">the leader acknowledges; the slot is free again</text>
</svg>
