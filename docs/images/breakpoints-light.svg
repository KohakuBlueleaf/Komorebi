<svg xmlns="http://www.w3.org/2000/svg" width="830" height="440" viewBox="0 0 830 440" role="img">
<title>A thread has a program counter and a place</title>
<style>
  text { font-family: -apple-system, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif; font-size: 13px; fill: #1f2328; }
  .mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, 'DejaVu Sans Mono', monospace; }
  .b { font-weight: 600; }
  .h { font-size: 14px; font-weight: 600; }
  .m { fill: #59636e; }
  .a { fill: #bc4c00; }
  .s { font-size: 12px; }
  .box { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1; }
  .plan { fill: none; stroke: #818b98; stroke-width: 1; stroke-dasharray: 5 4; }
  .cell { fill: #eaeef2; stroke: none; }
  .team { fill: #ffd8b5; stroke: #bc4c00; stroke-width: 1; }
  .abox { fill: #fff1e5; stroke: #bc4c00; stroke-width: 1.5; }
  .ln { stroke: #818b98; stroke-width: 1.5; fill: none; }
  .thin { stroke: #818b98; stroke-width: 1; fill: none; }
  .grid { stroke: #d1d9e0; stroke-width: 1; fill: none; }
  .al { stroke: #bc4c00; stroke-width: 2.5; fill: none; }
  .ad { stroke: #bc4c00; stroke-width: 2; fill: none; stroke-dasharray: 6 4; }
  .athin { stroke: #bc4c00; stroke-width: 1.2; fill: none; }
</style>
<defs>
  <marker id="ha" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5"
      markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#bc4c00"/>
  </marker>
  <marker id="hl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5"
      markerHeight="5" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#818b98"/>
  </marker>
</defs>
<rect width="830" height="440" fill="#ffffff"/>
<text x="20" y="26" class="h" xml:space="preserve">the program</text>
<text x="20" y="44" class="s m" xml:space="preserve">breakpoints are marked; between them a thread runs where it is</text>
<rect x="16" y="54" width="446" height="300" rx="4" class="box"/>
<text x="44" y="82" class="mono s m" text-anchor="end" xml:space="preserve">1</text>
<text x="54" y="82" class="mono" xml:space="preserve">thread path(pixel):</text>
<text x="44" y="107" class="mono s m" text-anchor="end" xml:space="preserve">2</text>
<text x="54" y="107" class="mono" xml:space="preserve">    r = camera_ray(pixel);  hit = none</text>
<text x="44" y="132" class="mono s m" text-anchor="end" xml:space="preserve">3</text>
<text x="54" y="132" class="mono" xml:space="preserve">    for k in treelets_along(r):</text>
<text x="310.73" y="132" class="s m" xml:space="preserve">tree top: on every core</text>
<rect x="17" y="140" width="444" height="24" fill="#fff1e5"/>
<rect x="17" y="140" width="3" height="24" fill="#bc4c00"/>
<text x="44" y="157" class="mono s b a" text-anchor="end" xml:space="preserve">4</text>
<text x="54" y="157" class="mono" xml:space="preserve">        at treelet[k]:</text>
<text x="256.26" y="157" class="b a" xml:space="preserve">move</text>
<text x="296.26" y="157" class="m" xml:space="preserve">the ray record, 64 B</text>
<text x="44" y="182" class="mono s m" text-anchor="end" xml:space="preserve">5</text>
<text x="54" y="182" class="mono" xml:space="preserve">            hit = closer(hit, walk(r, treelet[k]))</text>
<text x="44" y="207" class="mono s m" text-anchor="end" xml:space="preserve">6</text>
<text x="54" y="207" class="mono" xml:space="preserve">    c = shade(r, hit)</text>
<text x="250" y="207" class="s m" xml:space="preserve">runs where the thread is</text>
<rect x="17" y="215" width="444" height="24" fill="#fff1e5"/>
<rect x="17" y="215" width="3" height="24" fill="#bc4c00"/>
<text x="44" y="232" class="mono s b a" text-anchor="end" xml:space="preserve">7</text>
<text x="54" y="232" class="mono" xml:space="preserve">    emit film[pixel] += c</text>
<text x="279.75" y="232" class="b a" xml:space="preserve">emit</text>
<text x="319.75" y="232" class="m" xml:space="preserve">the value (pixel, c)</text>
<text x="44" y="257" class="mono s m" text-anchor="end" xml:space="preserve">8</text>
<text x="44" y="282" class="mono s m" text-anchor="end" xml:space="preserve">9</text>
<text x="54" y="282" class="mono" xml:space="preserve">thread resolve(t):</text>
<rect x="17" y="290" width="444" height="24" fill="#fff1e5"/>
<rect x="17" y="290" width="3" height="24" fill="#bc4c00"/>
<text x="44" y="307" class="mono s b a" text-anchor="end" xml:space="preserve">10</text>
<text x="54" y="307" class="mono" xml:space="preserve">    wait(pixels(t))</text>
<text x="250" y="307" class="b a" xml:space="preserve">wait</text>
<text x="290" y="307" class="m" xml:space="preserve">for every pixel of t</text>
<text x="44" y="332" class="mono s m" text-anchor="end" xml:space="preserve">11</text>
<text x="54" y="332" class="mono" xml:space="preserve">    write image[t] = film[t]</text>
<text x="476" y="26" class="h" xml:space="preserve">where it runs</text>
<text x="476" y="44" class="s m" xml:space="preserve">tinted: the path thread ran there; outlined: holds a home</text>
<rect x="476" y="56" width="58" height="58" rx="4" class="cell"/>
<rect x="543" y="56" width="58" height="58" rx="4" class="cell"/>
<rect x="610" y="56" width="58" height="58" rx="4" class="cell"/>
<rect x="677" y="56" width="58" height="58" rx="4" class="cell"/>
<rect x="744" y="56" width="58" height="58" rx="4" class="abox"/>
<text x="773" y="108" class="s m" text-anchor="middle" xml:space="preserve">treelet 5</text>
<rect x="756.75" y="61" width="32.5" height="20" rx="10" fill="#bc4c00"/>
<text x="773" y="75.5" text-anchor="middle" class="b s" style="fill: #ffffff">5-6</text>
<rect x="476" y="123" width="58" height="58" rx="4" class="cell"/>
<rect x="543" y="123" width="58" height="58" rx="4" class="cell"/>
<rect x="610" y="123" width="58" height="58" rx="4" class="abox"/>
<text x="639" y="175" class="s m" text-anchor="middle" xml:space="preserve">treelet 2</text>
<rect x="630.25" y="128" width="17.5" height="20" rx="10" fill="#bc4c00"/>
<text x="639" y="142.5" text-anchor="middle" class="b s" style="fill: #ffffff">5</text>
<rect x="677" y="123" width="58" height="58" rx="4" class="cell"/>
<rect x="744" y="123" width="58" height="58" rx="4" class="cell"/>
<rect x="476" y="190" width="58" height="58" rx="4" class="cell"/>
<rect x="543" y="190" width="58" height="58" rx="4" class="cell"/>
<rect x="610" y="190" width="58" height="58" rx="4" class="cell"/>
<rect x="677" y="190" width="58" height="58" rx="4" class="cell"/>
<rect x="744" y="190" width="58" height="58" rx="4" class="cell"/>
<rect x="476" y="257" width="58" height="58" rx="4" class="abox"/>
<text x="505" y="309" class="s m" text-anchor="middle" xml:space="preserve">start</text>
<rect x="488.75" y="262" width="32.5" height="20" rx="10" fill="#bc4c00"/>
<text x="505" y="276.5" text-anchor="middle" class="b s" style="fill: #ffffff">1-3</text>
<rect x="543" y="257" width="58" height="58" rx="4" class="cell"/>
<rect x="610" y="257" width="58" height="58" rx="4" class="cell"/>
<rect x="677" y="257" width="58" height="58" rx="4" class="box"/>
<text x="706" y="309" class="s m" text-anchor="middle" xml:space="preserve">film t</text>
<rect x="744" y="257" width="58" height="58" rx="4" class="cell"/>
<line x1="530" y1="261" x2="612" y2="179" class="al" marker-end="url(#ha)"/>
<line x1="669" y1="128" x2="742" y2="93" class="al" marker-end="url(#ha)"/>
<path d="M769,116 L724,254" class="ad" marker-end="url(#ha)"/>
<rect x="559.25" y="213" width="17.5" height="20" rx="10" fill="#bc4c00"/>
<text x="568" y="227.5" text-anchor="middle" class="b s" style="fill: #ffffff">4</text>
<rect x="693.25" y="96.5" width="17.5" height="20" rx="10" fill="#bc4c00"/>
<text x="702" y="111" text-anchor="middle" class="b s" style="fill: #ffffff">4</text>
<rect x="752.75" y="181.5" width="17.5" height="20" rx="10" fill="#bc4c00"/>
<text x="761.5" y="196" text-anchor="middle" class="b s" style="fill: #ffffff">7</text>
<rect x="693.5" y="262" width="25" height="20" rx="10" fill="#bc4c00"/>
<text x="706" y="276.5" text-anchor="middle" class="b s" style="fill: #ffffff">10</text>
<rect x="700" y="284" width="4" height="12" fill="#bc4c00"/>
<rect x="708" y="284" width="4" height="12" fill="#bc4c00"/>
<line x1="476" y1="356" x2="506" y2="356" class="al" marker-end="url(#ha)"/>
<text x="516" y="360" class="s" xml:space="preserve">the thread moves: its live variables travel</text>
<line x1="476" y1="378" x2="506" y2="378" class="ad" marker-end="url(#ha)"/>
<text x="516" y="382" class="s" xml:space="preserve">a value is sent; the sender keeps running</text>
<rect x="482" y="392" width="4" height="16" fill="#bc4c00"/>
<rect x="490" y="392" width="4" height="16" fill="#bc4c00"/>
<text x="516" y="404" class="s" xml:space="preserve">the thread waits until its values have landed</text>
<rect x="482.25" y="412" width="17.5" height="20" rx="10" fill="#bc4c00"/>
<text x="491" y="426.5" text-anchor="middle" class="b s" style="fill: #ffffff">4</text>
<text x="516" y="426" class="s" xml:space="preserve">lines of the program that run there</text>
</svg>
