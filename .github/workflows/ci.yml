name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Python format and lint
        run: |
          black --check .
          ruff check .
          blacken-docs -t py313 -l 88 $(git ls-files '*.md')

      - name: C/C++ format and comment lengths
        run: |
          python -m komorebi.tools.cxx_format --check
          python -m komorebi.tools.comment_lint --check src tests examples experiments packaging tutorial projects

      - name: Module sizes and imports
        run: python -m komorebi.tools.module_checks --check

      - name: Scripts reach no private name
        run: python -m komorebi.tools.private_reach --check

      - name: Device headers include no cycle
        run: python -m komorebi.tools.header_cycles --check

      - name: Documentation site
        run: NO_MKDOCS_2_WARNING=1 mkdocs build --strict -d "$RUNNER_TEMP/site"

      # A skip is counted: a new one fails the job. Nothing skips: the tests that need a
      # tt-metal tree are marked `tree`, deselected here and run by tree-tests; the
      # reference renderers' CUDA ones are marked `gpu` (no GPU here).
      - name: CPU tests
        env:
          SKIPS: "0"
        run: |
          python -m pytest -q -rs -n auto -m "not tree and not gpu" \
            tests/core tests/projects tests/ref \
            --junitxml="$RUNNER_TEMP/cpu.xml"
          python packaging/ci/skip_count.py "$RUNNER_TEMP/cpu.xml" "$SKIPS"

      - name: Version agrees with the package
        run: python packaging/version.py read

  # The host tests that need a tt-metal tree and the X280 compiler, on the build machine
  # (release.yml's runner: KMR_RUNTIME_TREE names its tree). On a push to main only: a
  # pull request's code never runs on that machine. No device is opened (KMR_CARD=0
  # overrides the runner's own) and none of these tests may skip.
  tree-tests:
    name: Host tests that need a tt-metal tree
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, linux, x64, komorebi-build]
    timeout-minutes: 10
    env:
      KMR_CARD: "0"
    steps:
      - uses: actions/checkout@v4

      - name: Install
        run: |
          python3.13 -m venv "$RUNNER_TEMP/venv"
          "$RUNNER_TEMP/venv/bin/pip" install -q -e ".[dev]"

      - name: Tests that need the tree
        shell: bash
        run: |
          export TT_METAL_HOME="$KMR_RUNTIME_TREE" KMR_CACHE="$RUNNER_TEMP/komorebi"
          "$RUNNER_TEMP/venv/bin/python" -m pytest -q -rs -n 8 -m tree tests/core \
            --junitxml="$RUNNER_TEMP/tree.xml"
          "$RUNNER_TEMP/venv/bin/python" packaging/ci/skip_count.py "$RUNNER_TEMP/tree.xml" 0

      # The scripts' checks off the card (tests/host_checks): each runs a
      # script, most on the mock card, whose kernels build with the tree.
      - name: Host check
        shell: bash
        run: |
          export TT_METAL_HOME="$KMR_RUNTIME_TREE" KMR_CACHE="$RUNNER_TEMP/komorebi"
          "$RUNNER_TEMP/venv/bin/python" -m komorebi.tools.host_check
