name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e ".[dev]"

      - name: Python format and lint
        run: |
          black --check .
          ruff check .
          blacken-docs -t py313 -l 88 $(git ls-files '*.md')

      - name: C/C++ format and comment lengths
        run: |
          python -m komorebi.tools.cxx_format --check
          python -m komorebi.tools.comment_lint --check src tests examples experiments packaging

      - name: CPU tests
        run: python -m pytest -q tests/core

      - name: Programs' CPU tests
        run: python -m pytest -q tests/projects

      - name: Version agrees with the package
        run: python packaging/version.py read
