name: ci

on:
  push:
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install
        run: pip install -e . black ruff pytest "clang-format>=22" numpy

      - name: Python format and lint
        run: |
          black --check .
          ruff check .

      - name: CPU tests
        run: python -m pytest -q tests/core
