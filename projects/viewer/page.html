<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Card viewer</title>
<style>
  :root { color-scheme: dark; --bg: #111; --fg: #ddd; --dim: #888; --line: #333; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 14px/1.4 system-ui, sans-serif; }
  header { display: flex; flex-wrap: wrap; gap: 12px; align-items: center;
           padding: 8px 16px; border-bottom: 1px solid var(--line); }
  select { background: #222; color: var(--fg); border: 1px solid var(--line);
           padding: 2px 6px; }
  #numbers { font-family: ui-monospace, monospace; color: var(--dim); }
  #status.bad { color: #e87; }
  #sun[hidden], #tone[hidden], #gi[hidden] { display: none; }
  #sun input[type=range], #tone input[type=range] { width: 140px; vertical-align: middle; }
  #size input { width: 5em; background: #222; color: var(--fg);
                border: 1px solid var(--line); padding: 2px 4px; }
  #size-reason { color: #e87; }
  button { background: #222; color: var(--fg); border: 1px solid var(--line);
           padding: 2px 8px; }
  main { display: flex; justify-content: center; padding: 8px 16px; }
  /* the frame at its own size, scaled down (aspect kept) to fit the window */
  #view { display: block; max-width: 100%; max-height: calc(100vh - 110px);
          width: auto; height: auto; object-fit: contain;
          background: #000; cursor: grab; user-select: none; outline: none;
          -webkit-user-drag: none; }
  #view.dragging { cursor: grabbing; }
  footer { padding: 0 16px 8px; color: var(--dim); text-align: center; }
</style>
</head>
<body>
<header>
  <label>renderer <select id="renderer"></select></label>
  <label>scene <select id="scene"></select></label>
  <span id="sun" hidden>
    <label>sun azimuth <input id="azimuth" type="range" min="-180" max="180" step="any"></label>
    <label>elevation <input id="elevation" type="range" min="-10" max="90" step="any"></label>
    <button id="reset-sun" type="button">reset sun</button>
  </span>
  <span id="tone" hidden>
    <label>exposure <input id="exposure" type="range" min="-2" max="3" step="any"></label>
    <label>saturation <input id="saturation" type="range" min="0" max="2" step="0.01"></label>
    <label>curve <select id="curve"><option value="0">plain</option><option value="1">filmic</option></select></label>
    <button id="reset-tone" type="button">reset tone</button>
  </span>
  <label id="gi" hidden><input id="indirect" type="checkbox"> indirect light</label>
  <span id="size">
    <label>width <input id="width" type="number" min="1" max="2048" step="1"></label>
    <label>height <input id="height" type="number" min="1" max="1024" step="1"></label>
    <button id="apply-size" type="button">size</button>
    <span id="size-reason"></span>
  </span>
  <span id="numbers"></span>
  <span id="status"></span>
</header>
<main><img id="view" alt="the card's frames" tabindex="0" draggable="false"></main>
<footer>click the image, then: W A S D move, Q E down / up, drag to turn, shift faster</footer>
<script>
"use strict";
const token = new URLSearchParams(location.search).get("token") || "";
const q = "?token=" + encodeURIComponent(token);
const view = document.getElementById("view");
const rendererSelect = document.getElementById("renderer");
const sceneSelect = document.getElementById("scene");
const numbers = document.getElementById("numbers");
const statusText = document.getElementById("status");
const sunControls = document.getElementById("sun");
const azimuthInput = document.getElementById("azimuth");
const elevationInput = document.getElementById("elevation");
const toneControls = document.getElementById("tone");
const exposureInput = document.getElementById("exposure");  // log2 of the exposure
const saturationInput = document.getElementById("saturation");
const curveSelect = document.getElementById("curve");
const giControl = document.getElementById("gi");
const indirectInput = document.getElementById("indirect");
const widthInput = document.getElementById("width");
const heightInput = document.getElementById("height");
const sizeReason = document.getElementById("size-reason");
let sizeShown = false;    // the inputs hold the server's size once

let pose = null;          // {position: [x, y, z], yaw, pitch}
let sceneSerial = -1;     // the scene the pose is of
let diagonal = 1;
let changed = false;
let lastPost = 0;
let posting = false;
const held = new Set();
let sunOwn = null;        // the scene's own sun [azimuth, elevation] (raster-lit)
let sunScene = -1;        // the scene the sliders are of
let sunChanged = false;
let lastSunPost = 0;
let toneOwn = null;       // the scene's tone [exposure, saturation, curve] (lit)
let toneScene = -1;       // the scene the tone controls are of
let toneChanged = false;
let lastTonePost = 0;
let giScene = -1;         // the scene the indirect checkbox is of

view.src = "/stream" + q;

function post(path, body) {
  return fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Token": token},
    body: JSON.stringify(body),
  });
}

function fill(select, values, chosen) {
  if (select.options.length !== values.length) {
    select.innerHTML = "";
    for (const value of values) select.add(new Option(value, value));
  }
  if (document.activeElement !== select && chosen) select.value = chosen;
}

async function refresh() {
  try {
    const response = await fetch("/state" + q, {cache: "no-store"});
    const state = await response.json();
    offers = state.offers;
    fill(sceneSelect, state.scenes, state.selected[1]);
    fill(rendererSelect, offered(sceneSelect.value), state.selected[0]);
    diagonal = state.diagonal || 1;
    if (state.scene_serial !== sceneSerial && state.first_pose) {
      sceneSerial = state.scene_serial;
      pose = JSON.parse(JSON.stringify(state.first_pose));
      changed = false;
    }
    sunOwn = state.sun_own;
    sunControls.hidden = sunOwn === null;
    if (sunOwn !== null && state.scene_serial !== sunScene) {
      sunScene = state.scene_serial;  // a new scene: its own sun on the sliders
      azimuthInput.value = state.sun[0];
      elevationInput.value = state.sun[1];
      sunChanged = false;
    }
    toneOwn = state.tone_own;
    toneControls.hidden = toneOwn === null;
    if (toneOwn !== null && state.scene_serial !== toneScene) {
      toneScene = state.scene_serial;  // a new load: the scene's tone on the controls
      showTone(state.tone);
      toneChanged = false;
    }
    giControl.hidden = state.indirect === null;
    if (state.indirect !== null && state.scene_serial !== giScene) {
      giScene = state.scene_serial;
      indirectInput.checked = state.indirect;
    }
    const ms = state.card_ms === null ? "-" : state.card_ms.toFixed(1);
    let sunText = "";
    if (state.sun) {
      const pass = state.sun_ms === null ? "-" : state.sun_ms.toFixed(1);
      sunText = `  sun ${state.sun[0].toFixed(1)}, ${state.sun[1].toFixed(1)}  SUN pass ms ${pass}`;
    }
    if (state.tone) {
      sunText += `  exposure ${state.tone[0].toFixed(2)} saturation ${state.tone[1].toFixed(2)} ` +
        (state.tone[2] === 1 ? "filmic" : "plain");
    }
    if (state.indirect !== null) sunText += state.indirect ? "  indirect on" : "  indirect off";
    if (!sizeShown && state.size_asked) {
      sizeShown = true;
      widthInput.value = state.size_asked[0];
      heightInput.value = state.size_asked[1];
    }
    if (state.size) {
      sunText += `  ${state.size[0]} x ${state.size[1]}` + (state.sizes === false ? " (only)" : "");
    }
    numbers.textContent = `${state.renderer || "-"} / ${state.scene || "-"}  ` +
      `${state.card_ms_label || "frame ms"} ${ms}  ${state.fps} frames/s  frame ${state.frame}` +
      sunText;
    statusText.textContent = state.status;
    statusText.className = state.status === "running" ? "" :
      (state.status === "loading" ? "" : "bad");
  } catch (error) {
    statusText.textContent = "no answer from the server";
    statusText.className = "bad";
  }
}
refresh();
setInterval(refresh, 500);

// The renderers offered on a scene (raster-textured: scenes with materials).
let offers = {};
function offered(scene) {
  return Object.keys(offers).filter((name) => offers[name].includes(scene));
}
function select() {
  const names = offered(sceneSelect.value);
  const renderer = names.includes(rendererSelect.value) ? rendererSelect.value : names[0];
  post("/select", {renderer: renderer, scene: sceneSelect.value});
}
rendererSelect.addEventListener("change", select);
sceneSelect.addEventListener("change", select);

// The sun: a slider's move posts the angles (at most 10 times a second, the newest);
// the server applies the newest between frames (the card's SUN pass).
azimuthInput.addEventListener("input", () => { sunChanged = true; });
elevationInput.addEventListener("input", () => { sunChanged = true; });
document.getElementById("reset-sun").addEventListener("click", () => {
  if (sunOwn === null) return;
  azimuthInput.value = sunOwn[0];
  elevationInput.value = sunOwn[1];
  sunChanged = true;
});

// The tone: exposure (a logarithmic slider), saturation, curve; posted as the sun is,
// applied between frames (LIGHT's table). The indirect switch: posted on a change.
function showTone(tone) {
  exposureInput.value = Math.log2(tone[0]);
  saturationInput.value = tone[1];
  curveSelect.value = String(tone[2]);
}
exposureInput.addEventListener("input", () => { toneChanged = true; });
saturationInput.addEventListener("input", () => { toneChanged = true; });
curveSelect.addEventListener("change", () => { toneChanged = true; });
document.getElementById("reset-tone").addEventListener("click", () => {
  if (toneOwn === null) return;
  showTone(toneOwn);
  toneChanged = true;
});
indirectInput.addEventListener("change", () => {
  post("/indirect", {on: indirectInput.checked, scene_serial: sceneSerial}).catch(() => {});
});

// The frame's size: posted on the button (or Enter); the server refuses a size the card's
// grid does not take, with the reason shown here, else applies it between frames.
async function applySize() {
  const body = {width: Number(widthInput.value), height: Number(heightInput.value)};
  try {
    const response = await post("/size", body);
    const answer = await response.json();
    sizeReason.textContent = response.ok ? "" : "refused: " + answer.error;
  } catch (error) {
    sizeReason.textContent = "no answer from the server";
  }
}
document.getElementById("apply-size").addEventListener("click", applySize);
for (const input of [widthInput, heightInput]) {
  input.addEventListener("keydown", (event) => { if (event.key === "Enter") applySize(); });
}

function forward() {
  const c = Math.cos(pose.pitch);
  return [c * Math.sin(pose.yaw), Math.sin(pose.pitch), c * Math.cos(pose.yaw)];
}
function right() {  // y x forward, on the ground
  return [Math.cos(pose.yaw), 0, -Math.sin(pose.yaw)];
}

const keys = {w: 1, a: 1, s: 1, d: 1, q: 1, e: 1};
addEventListener("keydown", (event) => {
  if (event.target instanceof HTMLSelectElement || event.target instanceof HTMLInputElement &&
      event.target.type === "number") return;
  const key = event.key.toLowerCase();
  if (keys[key]) { held.add(key); event.preventDefault(); }
});
addEventListener("keyup", (event) => held.delete(event.key.toLowerCase()));
addEventListener("blur", () => held.clear());
let shift = false;
addEventListener("keydown", (event) => { shift = event.shiftKey; });
addEventListener("keyup", (event) => { shift = event.shiftKey; });

let drag = null;
view.addEventListener("pointerdown", (event) => {
  view.focus();
  drag = {x: event.clientX, y: event.clientY};
  view.setPointerCapture(event.pointerId);
  view.classList.add("dragging");
});
view.addEventListener("pointermove", (event) => {
  if (!drag || !pose) return;
  const turn = Math.PI / view.clientWidth;  // a whole width: half a turn
  pose.yaw += (event.clientX - drag.x) * turn;
  pose.pitch -= (event.clientY - drag.y) * turn;
  const limit = 89 * Math.PI / 180;
  pose.pitch = Math.max(-limit, Math.min(limit, pose.pitch));
  drag = {x: event.clientX, y: event.clientY};
  changed = true;
});
function endDrag() { drag = null; view.classList.remove("dragging"); }
view.addEventListener("pointerup", endDrag);
view.addEventListener("pointercancel", endDrag);

let before = performance.now();
function tick(now) {
  const seconds = Math.min((now - before) / 1000, 0.1);
  before = now;
  if (pose && held.size) {
    const step = diagonal * 0.1 * (shift ? 5 : 1) * seconds;  // a tenth of the box a second
    const f = forward(), r = right(), move = [0, 0, 0];
    const add = (v, s) => { for (let i = 0; i < 3; i++) move[i] += v[i] * s; };
    if (held.has("w")) add(f, 1);
    if (held.has("s")) add(f, -1);
    if (held.has("d")) add(r, 1);
    if (held.has("a")) add(r, -1);
    if (held.has("e")) add([0, 1, 0], 1);
    if (held.has("q")) add([0, 1, 0], -1);
    for (let i = 0; i < 3; i++) pose.position[i] += move[i] * step;
    changed = true;
  }
  if (sunChanged && sunOwn !== null && now - lastSunPost >= 100) {
    sunChanged = false;
    lastSunPost = now;
    post("/sun", {azimuth: Number(azimuthInput.value), elevation: Number(elevationInput.value),
                  scene_serial: sceneSerial}).catch(() => {});
  }
  if (toneChanged && toneOwn !== null && now - lastTonePost >= 100) {
    toneChanged = false;
    lastTonePost = now;
    post("/tone", {exposure: 2 ** Number(exposureInput.value),
                   saturation: Number(saturationInput.value),
                   curve: Number(curveSelect.value), scene_serial: sceneSerial}).catch(() => {});
  }
  if (changed && !posting && now - lastPost >= 1000 / 30) {
    changed = false;
    posting = true;
    lastPost = now;
    post("/pose", {...pose, scene_serial: sceneSerial})
      .catch(() => {})
      .finally(() => { posting = false; });
  }
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);
</script>
</body>
</html>
